<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Removedor de Fondos</title>
    
    <style>
        /* Estilos e Identidad Corporativa de TechUtilidadesKit.com */
        :root {
            --primary-color: #0f172a;
            --accent-color: #2563eb;
            --bg-light: #f8fafc;
            --text-main: #334155;
            --border-radius: 10px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .contenedor {
            max-width: 480px;
            width: 90%;
            background: #ffffff;
            padding: 35px;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            text-align: center;
            box-sizing: border-box;
        }

        .header-kit {
            margin-bottom: 25px;
        }

        .header-kit h3 {
            color: var(--primary-color);
            font-size: 22px;
            margin: 0 0 8px 0;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header-kit .brand-badge {
            display: inline-block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: #eff6ff;
            color: var(--accent-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        #progreso-texto {
            font-size: 13.5px;
            font-weight: 500;
            color: #64748b;
            background: #f1f5f9;
            padding: 10px 14px;
            border-radius: 6px;
            margin: 20px 0;
            border-left: 4px solid var(--accent-color);
            text-align: left;
        }

        #barra-progreso {
            display: block;
            width: 100%;
            height: 12px;
            margin: -10px 0 20px;
            accent-color: var(--accent-color);
        }

        #barra-progreso[hidden],
        #descargar-resultado[hidden] {
            display: none;
        }

        .download-link {
            display: inline-block;
            margin-top: 16px;
            padding: 10px 16px;
            border-radius: 6px;
            background: var(--accent-color);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }

        .file-upload-wrapper {
            margin-bottom: 25px;
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            color: var(--text-main);
            cursor: pointer;
            box-sizing: border-box;
        }

        input[type="file"]::-webkit-file-upload-button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            margin-right: 10px;
        }

        .preview-box {
            background: #fafafa;
            border: 2px dashed #cbd5e1;
            border-radius: var(--border-radius);
            min-height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow: hidden;
            position: relative;
        }

        .preview-placeholder {
            position: absolute;
            color: #94a3b8;
            font-size: 14px;
            pointer-events: none;
        }

        img {
            max-width: 100%;
            max-height: 350px;
            object-fit: contain;
            border-radius: 6px;
            z-index: 2;
            background-image: linear-gradient(45deg, #efefef 25%, transparent 25%), 
                              linear-gradient(-45deg, #efefef 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #efefef 75%), 
                              linear-gradient(-45deg, transparent 75%, #efefef 75%);
            background-size: 20px 20px;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <div class="header-kit">
            <span class="brand-badge">TechUtilidadesKit.com</span>
            <h3>Remover Fondo con IA</h3>
        </div>
        
        <div id="progreso-texto">Inicializando interfaz...</div>
        <progress id="barra-progreso" max="100" value="0" aria-label="Progreso del proceso"></progress>
        
        <div class="file-upload-wrapper">
            <input type="file" id="subir-imagen" accept="image/*" disabled />
        </div>
        
        <div class="preview-box">
            <div id="placeholder-texto" class="preview-placeholder">Tu imagen sin fondo aparecerá aquí</div>
            <img id="resultado-ia" alt="Resultado libre de fondo" style="display: none;" />
        </div>
        <a id="descargar-resultado" class="download-link" hidden download="imagen-sin-fondo.png">Descargar PNG sin fondo</a>
    </div>

    <script type="module" src="./app/remover_ai.ts"></script>
</body>
</html>
