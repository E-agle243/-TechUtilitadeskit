<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Removedor de Fondos</title>
    
    <style>:root{--primary-color:#0f172a;--accent-color:#2563eb;--bg-light:#f8fafc;--text-main:#334155;--border-radius:10px}body{background-color:var(--bg-light);color:var(--text-main);flex-direction:column;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:0;font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;display:flex}.contenedor{border-radius:var(--border-radius);text-align:center;box-sizing:border-box;background:#fff;border:1px solid #e2e8f0;width:90%;max-width:480px;padding:35px;box-shadow:0 10px 25px -5px #0000000d,0 8px 10px -6px #0000000d}.header-kit{margin-bottom:25px}.header-kit h3{color:var(--primary-color);letter-spacing:-.5px;margin:0 0 8px;font-size:22px;font-weight:700}.header-kit .brand-badge{text-transform:uppercase;letter-spacing:1px;color:var(--accent-color);background:#eff6ff;border-radius:20px;padding:4px 12px;font-size:11px;font-weight:600;display:inline-block}#progreso-texto{color:#64748b;border-left:4px solid var(--accent-color);text-align:left;background:#f1f5f9;border-radius:6px;margin:20px 0;padding:10px 14px;font-size:13.5px;font-weight:500}#barra-progreso{width:100%;height:12px;accent-color:var(--accent-color);margin:-10px 0 20px;display:block}#barra-progreso[hidden],#descargar-resultado[hidden]{display:none}.download-link{background:var(--accent-color);color:#fff;border-radius:6px;margin-top:16px;padding:10px 16px;font-size:14px;font-weight:600;text-decoration:none;display:inline-block}.file-upload-wrapper{margin-bottom:25px}input[type=file]{width:100%;color:var(--text-main);cursor:pointer;box-sizing:border-box;background:#fff;border:1px solid #cbd5e1;border-radius:6px;padding:10px;font-size:14px}input[type=file]::-webkit-file-upload-button{background:var(--primary-color);color:#fff;cursor:pointer;border:none;border-radius:4px;margin-right:10px;padding:8px 16px;font-weight:500}.preview-box{border-radius:var(--border-radius);background:#fafafa;border:2px dashed #cbd5e1;justify-content:center;align-items:center;min-height:220px;padding:10px;display:flex;position:relative;overflow:hidden}.preview-placeholder{color:#94a3b8;pointer-events:none;font-size:14px;position:absolute}img{object-fit:contain;z-index:2;background-image:linear-gradient(45deg,#efefef 25%,#0000 25%),linear-gradient(-45deg,#efefef 25%,#0000 25%),linear-gradient(45deg,#0000 75%,#efefef 75%),linear-gradient(-45deg,#0000 75%,#efefef 75%);background-size:20px 20px;border-radius:6px;max-width:100%;max-height:350px}</style>
  <script type="module" crossorigin src="/-TechUtilitadeskit/assets/remover-CQOa6YxE.js"></script>
  <link rel="modulepreload" crossorigin href="/-TechUtilitadeskit/assets/modulepreload-polyfill-P2Xu9kJm.js">
</head>
<body>

    <div class="contenedor">
        <div class="header-kit">
            <span class="brand-badge">TechUtilidadesKit.com</span>
            <h3>Remover Fondo con IA</h3>
        </div>
        
        <div id="progreso-texto">Inicializando interfaz...</div>
        <progress id="barra-progreso" max="100" value="0" aria-label="Progreso del proceso"></progress>
        
        <div class="file-upload-wrapper">
            <input type="file" id="subir-imagen" accept="image/*" disabled />
        </div>
        
        <div class="preview-box">
            <div id="placeholder-texto" class="preview-placeholder">Tu imagen sin fondo aparecerá aquí</div>
            <img id="resultado-ia" alt="Resultado libre de fondo" style="display: none;" />
        </div>
        <a id="descargar-resultado" class="download-link" hidden download="imagen-sin-fondo.png">Descargar PNG sin fondo</a>
    </div>

</body>
</html>
